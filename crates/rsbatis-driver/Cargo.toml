[package]
name = "rsbatis-driver"
version = "0.1.0-alpha.29"
edition = "2021"
rust-version = "1.80"
description = "Query execution layer for rsbatis: a driver abstraction over SQLite and MySQL with runtime-shaped parameter binding."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pengdeyou/rsbatis"
keywords = ["orm", "sql", "driver", "database", "sqlite"]
categories = ["database"]
readme = "README.md"
documentation = "https://docs.rs/rsbatis-driver"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"], optional = true }
# 指向仓库内的 fork：协议逻辑与上游一致，只把底层 socket 换成可插拔后端。
# 发布顺序：先发 rsbatis-mysql（本 fork），再发 driver——否则 registry 上取不到。
mysql = { version = "=28.0.4", package = "rsbatis-mysql", path = "../../vendor/mysql", default-features = false, optional = true }
flate2 = { version = "1", default-features = false, optional = true }
rsbatis-core = { version = "0.1.0-alpha.29", path = "../rsbatis-core" }
rusqlite = { version = "0.43", features = ["bundled"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]
mysql = ["dep:mysql", "dep:flate2", "flate2/rust_backend"]
# 日期时间：只影响值转换与 FromValue，不改变 SQL 渲染
chrono = ["dep:chrono", "rsbatis-core/chrono"]
