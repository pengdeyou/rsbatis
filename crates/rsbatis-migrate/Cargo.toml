[package]
name = "rsbatis-migrate"
version = "0.1.0-alpha.29"
edition = "2021"
rust-version = "1.80"
description = "Schema migration tool for rsbatis: versioned SQL migrations with up/down, status and rollback."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pengdeyou/rsbatis"
keywords = ["orm", "sql", "migrate", "database"]
categories = ["database"]
readme = "README.md"
documentation = "https://docs.rs/rsbatis-migrate"

[dependencies]
rsbatis-core = { version = "0.1.0-alpha.29", path = "../rsbatis-core" }
rsbatis-driver = { version = "0.1.0-alpha.29", path = "../rsbatis-driver" }
rsbatis-orm = { version = "0.1.0-alpha.29", path = "../rsbatis-orm" }

[dev-dependencies]
rsbatis-driver = { version = "0.1.0-alpha.29", path = "../rsbatis-driver", features = ["sqlite", "mysql"] }

[features]
default = []
