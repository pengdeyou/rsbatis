[package]
name = "rsbatis-macros"
version = "0.1.0-alpha.29"
edition = "2021"
rust-version = "1.80"
description = "Procedural macros for rsbatis: SQLAlchemy-style where_! / select! token rewriting and entity derives."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pengdeyou/rsbatis"
homepage = "https://github.com/pengdeyou/rsbatis"
keywords = ["orm", "sql", "macro", "database"]
categories = ["database"]
readme = "README.md"
documentation = "https://docs.rs/rsbatis-macros"

[lib]
proc-macro = true

[dependencies]
# derive(Entity) 需要完整语法树解析（泛型、属性、路径类型），
# 手写 TokenTree 扫描器撑不住；这与 serde/serde_derive 的依赖结构一致。
syn = { version = "2", features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"
