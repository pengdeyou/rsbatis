name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 各 job 共用同一组 feature，避免"本地开了全部、CI 只开一半"造成的漏检查
  FEATURES: rsbatis/sqlite,rsbatis/mysql,rsbatis/chrono,rsbatis/migrate

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不写 toolchain 参数：仓库根的 rust-toolchain.toml 会被 rustup 自动读取。
      # 这一点很重要——trybuild 的快照绑定 rustc 版本，CI 必须和本地一致。
      - name: Show toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --features "$FEATURES" -- -D warnings

      # 单独再查一遍"默认 feature"（不带任何数据库）：有些 cfg 分支只在
      # 不开数据库时被编译，全开 feature 反而看不到它们。
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (sqlite + mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rsbatis
          MYSQL_DATABASE: rsbatis_test
        ports:
          - 3306:3306
        # 用 native_password 是因为 `mysql` crate 的默认握手路径在 CI 里最省事；
        # MySQL 8.4 已经删掉这个参数，所以镜像钉在 8.0。
        options: >-
          --default-authentication-plugin=mysql_native_password
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prsbatis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      # SQLite 用 bundled 编译，不需要系统装 libsqlite3；只需要一个 C 编译器。
      # --examples 不是可选项：README 里的代码片段就是 examples/ 里的文件，
      # 文档写错时这里必须编译失败，而不是等读者照着写进项目才发现。
      - name: Build (lib + examples)
        run: cargo build --workspace --features "$FEATURES" --examples

      # --test-threads=1 不是保守：多个用例会 DROP/CREATE 同名表，
      # 并行跑会互相踩，见 08 号报告的复现记录。
      - name: Test
        env:
          RSBATIS_MYSQL_URL: mysql://root:rsbatis@127.0.0.1:3306/rsbatis_test
        run: cargo test --workspace --features "$FEATURES" -- --test-threads=1

  test-no-db:
    name: test (no database feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      # 只有 Core / 宏 / 诊断基线能在没有数据库的情况下跑；
      # 这条 job 的作用是保证"不用数据库的人"也能编译通过。
      - name: Test default features
        run: cargo test --workspace
